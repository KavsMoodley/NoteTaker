name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package app (win32 x64)
        run: npx electron-packager . NoteTaker --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Zip package
        run: cd dist && zip -r NoteTaker-win32-x64.zip NoteTaker-win32-x64

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NoteTaker-win32-x64.zip
